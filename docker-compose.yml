services:
  db:
    image: mysql:8.0
    container_name: school-db-3810
    command: ["mysqld", "--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_DATABASE: school_db
      MYSQL_USER: school_user
      MYSQL_PASSWORD: school_pass
      MYSQL_ROOT_PASSWORD: rootpass3810
    ports:
      - "13810:3306"
    volumes:
      - school_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -prootpass3810"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: school-backend-3810
    environment:
      APP_NAME: school-affairs-api
      APP_HOST: 0.0.0.0
      APP_PORT: 8810
      LOG_LEVEL: INFO
      SECRET_KEY: school-secret-3810
      ACCESS_TOKEN_EXPIRE_MINUTES: 720
      DATABASE_URL: mysql+pymysql://school_user:school_pass@db:3306/school_db
      FRONTEND_ORIGIN: http://localhost:3810
      BACKUP_DIR: /app/backups
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backup_data:/app/backups
    ports:
      - "8810:8810"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: school-frontend-3810
    depends_on:
      - backend
    ports:
      - "3810:80"
    restart: unless-stopped

volumes:
  school_mysql_data:
  backup_data:
